name: macos

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - .github/workflows/macos.yml
      - ansible/files/**
      - ansible/handlers/**
      - ansible/main.yml
      - ansible/tasks/MacOSX.yml
      - ansible/tasks/common.yml
      - ansible/vars/Darwin.yml
      - ansible/vars/common.yml

permissions: read-all

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 100
    steps:
      # Make the runner look like a new Mac with only Homebrew installed - the
      # playbook installs everything else. Xcode Command Line Tools are kept.
      - name: Remove preinstalled software
        run: |
          set -euxo pipefail
          read -ra CASKS <<< "$(brew list --cask | xargs)"
          if [[ ${#CASKS[@]} -gt 0 ]]; then
            brew uninstall --cask --zap --force "${CASKS[@]}"
          fi
          # --ignore-dependencies: some formulae (azure-cli) are not listed by
          # "brew list" and would block the removal of their dependencies
          read -ra FORMULAE <<< "$(brew list --formula | xargs)"
          if [[ ${#FORMULAE[@]} -gt 0 ]]; then
            brew uninstall --force --ignore-dependencies "${FORMULAE[@]}"
          fi
          for TAP in $(brew tap); do
            brew untap --force "${TAP}"
          done
          # Leftovers not known to "brew list" (cleanup prunes their symlinks)
          BREW_CELLAR="$(brew --cellar)"
          BREW_CASKROOM="$(brew --caskroom)"
          rm -rf "${BREW_CELLAR:?}"/* "${BREW_CASKROOM:?}"/*
          brew cleanup --prune=all -s
          rm -rf "$(brew --cache)"
          brew list
          sudo find /usr/local -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          sudo xcode-select --switch /Library/Developer/CommandLineTools
          find /Applications -mindepth 1 -maxdepth 1 ! -name Safari.app ! -name Utilities -print -exec sudo rm -rf {} +
          cd "${HOME}"
          rm -rf .android .bash_profile .bashrc .bundle .cargo .cocoapods .composer .config .dotnet .fastlane .gem .gitconfig \
            .gradle .local .m2 .npm .npmrc .nuget .nvm .profile .rustup .yarn .yarnrc .zprofile .zshrc \
            hostedtoolcache Library/Android

      # Ansible is installed outside of Homebrew (uv + its own Python) so it
      # doesn't interfere with the packages installed by the playbook
      - name: Install Ansible
        env:
          UV_INSTALL_DIR: ${{ runner.temp }}/uv/bin
          UV_NO_MODIFY_PATH: 1
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/uv/python
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/uv/bin
          UV_TOOL_DIR: ${{ runner.temp }}/uv/tools
        run: |
          set -euxo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          "${UV_INSTALL_DIR}/uv" tool install --managed-python --with ansible ansible-core
          echo "${UV_TOOL_BIN_DIR}" >> "${GITHUB_PATH}"
          echo "ANSIBLE_PYTHON_INTERPRETER=${UV_TOOL_DIR}/ansible-core/bin/python" >> "${GITHUB_ENV}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ansible
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ansible || exit
          ansible-playbook --skip-tags data,skip_test --connection=local -i "127.0.0.1," main.yml

      - name: Ansible - Idempotence tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ansible || exit
          ansible-playbook --skip-tags data,skip_test,skip_idempotence_test --connection=local -i "127.0.0.1," main.yml | tee /tmp/ansible.log
          # https://stackoverflow.com/questions/59361798/github-actions-functions-on-the-console-output
          if [ "$(grep -c 'changed=0.*failed=0' /tmp/ansible.log)" = "1" ] ; then
            echo -e '\n✅ Idempotence test: pass'
            exit 0
          else
            echo -e '\n❗️ Idempotence test: fail\n'
            grep -B 2 '^changed:' /tmp/ansible.log
            exit 1
          fi

      # https://apple.stackexchange.com/questions/313130/with-brew-how-do-i-only-list-packages-that-were-built-from-source-not-poured-f
      - name: List brew packages that were built from source (ideally empty)
        run: |
          brew info --json=v1 --installed | jq -r "map(select(.installed[].poured_from_bottle | not) | .name) | unique | .[]"

      - name: List brew packages and their sizes
        run: |
          echo "*** Formulae"
          du -sh "$(brew --cellar)"/* | sort -hr
          echo "*** Casks"
          du -sh "$(brew --caskroom)"/* | sort -hr

      - name: Brew packages dependency tree
        env:
          HOMEBREW_NO_ENV_HINTS: 1
        run: |
          for FORMULA in $(brew leaves --installed-on-request); do
            echo "*** ${FORMULA}"
            brew deps --installed --tree "${FORMULA}"
          done
