# keep-sorted start newline_separated=yes
- name: Grub2 config
  ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg
  changed_when: false
  become: true

- name: Newaliases
  ansible.builtin.command: newaliases
  changed_when: false
  become: true

- name: Plymouth rebuild initrd
  ansible.builtin.command: plymouth-set-default-theme {{ plymouth_theme }} --rebuild-initrd
  changed_when: false
  become: true

- name: Reload systemctl
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Set login picture
  ansible.builtin.shell: |
    dscl . delete /Users/{{ ansible_facts['user_id'] }} JPEGPhoto
    dscl . delete /Users/{{ ansible_facts['user_id'] }} Picture
    dsimport /Library/Caches/{{ ansible_facts['user_id'] }}.picture.dsimport /Local/Default M
  changed_when: false
  become: true
# keep-sorted end
