# keep-sorted start newline_separated=yes
# Items to add to the dock
dock_add_items:
  - /Applications/Brave Browser Beta.app
  - /Applications/Ghostty.app
  - /Applications/Google Chrome.app

# The Dock icons size
dock_icons_size: 36.0

homebrew_casks:
  # keep-sorted start
  - brave-browser@beta
  - claude-code
  - font-meslo-lg-nerd-font # Nerd Font glyphs for the terminal prompt/icons and VS Code
  - ghostty
  - home-assistant
  - keepassxc
  - kopiaui
  - stats
  - thaw
  - utm
  - visual-studio-code
  - vlc
  - vorssaint
  # keep-sorted end

homebrew_packages:
  # keep-sorted start
  - ab-av1
  - actions-up
  - atuin
  - awscli
  - azure-cli
  - bash
  - bat
  - betterleaks # pre-commit hook
  - carapace
  - checkov # pre-commit hook (terraform_checkov)
  - cloudflared # needed for ssh with cloudflare tunnels
  - codeburn
  - container
  - dive
  - docker
  - docker-buildx
  - dockutil
  - dua-cli
  - eks-node-viewer
  - eksctl
  - exiftool
  - eza
  - fd
  - fnox
  - fzf
  - gawk
  - gh
  - git
  - git-delta # A viewer for git and diff output
  - gnu-sed
  - gnu-tar
  - gnupg
  - grep
  - hashicorp/tap/terraform # pre-commit hook (terraform_fmt, terraform_validate)
  - helm
  - htop
  - imagemagick
  - infat
  - iproute2mac
  - jq
  - k9s
  - keep-sorted # pre-commit hook
  - kopia
  - krew
  - kubecolor
  - kubernetes-cli
  - midnight-commander
  - mise
  - mpv
  - neovim
  - oh-my-posh
  - opencode
  - opentofu
  - prek # runs the pre-commit config
  - prettier # pre-commit hook
  - rclone
  - rhash
  - rmtrash
  - rsync
  - shellcheck # pre-commit hook
  - shfmt # pre-commit hook
  - socktainer
  - tfupdate # pre-commit hook
  - trivy # pre-commit hook (terraform_trivy)
  - uutils-coreutils
  - uutils-findutils
  - wget
  - yamllint # pre-commit hook
  - yq
  - yt-dlp
  - zoxide
  - zsh-completions
  - zsh-patina
  # keep-sorted end

homebrew_prefix: "{% if (ansible_facts['architecture'] | regex_search('arm')) %}/opt/homebrew/{% else %}/usr/local/{% endif %}"

homebrew_services:
  # keep-sorted start
  - socktainer
  # keep-sorted end

homebrew_taps:
  # eks-node-viewer (not available in homebrew-core)
  - aws/tap
  # terraform (homebrew-core stopped updating it after the BUSL license change)
  - hashicorp/tap

login_items_enabled:
  # keep-sorted start
  - KeePassXC
  - Stats
  - Thaw
  # keep-sorted end
# keep-sorted end
