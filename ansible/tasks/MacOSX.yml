# Radial menu profiles are stored as raw data, which osx_defaults can not write
- name: Configure the Vorssaint radial menu profiles
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      JSON='{{ vorssaint_radial_menu_profiles | to_json }}'
      CURRENT="$(defaults export com.vorssaint.utils - |
        plutil -extract radialMenuProfiles raw -o - - 2> /dev/null | base64 -d)"
      if [ "${CURRENT}" = "${JSON}" ]; then
        exit 90
      fi
      defaults write com.vorssaint.utils radialMenuProfiles -data "$(printf %s "${JSON}" | xxd -p | tr -d '\n')"
  register: vorssaint_radial_menu_profiles_result
  changed_when: vorssaint_radial_menu_profiles_result.rc == 0
  failed_when: vorssaint_radial_menu_profiles_result.rc not in [0, 90]
  vars:
    vorssaint_radial_menu_profiles:
      - name: ""
        color: "accent"
        trackpadTap: false
        id: "7899AE81-2C38-4D14-8867-DFA08CE64362"
        shortcut: "control+option+command:49"
        items:
          - id: "7E79C96E-5D8F-4680-9DDA-16E20AB59F1F"
            payload: "playPause"
            children: []
            kind: "media"
            name: ""
            symbolName: ""
          - id: "A32EF7CF-987D-4785-B224-B4A2034C95AA"
            payload: "nextTrack"
            children: []
            kind: "media"
            name: ""
            symbolName: ""
          - id: "A2EC9385-671A-43A9-B4F2-14ACBD5F1468"
            payload: "screenshot"
            children: []
            kind: "tool"
            name: ""
            symbolName: ""
          - id: "2F2E7613-87FB-49F2-B4CD-5FC3FD6B09BF"
            payload: "~/Downloads"
            children: []
            kind: "file"
            name: ""
            symbolName: ""
          - id: "EAC5E87E-4411-42C7-8066-038FE485D64B"
            payload: "colorPicker"
            children: []
            kind: "tool"
            name: ""
            symbolName: ""
          - id: "BB08B178-EACB-4158-B3E7-20625FEA0C13"
            payload: "previousTrack"
            children: []
            kind: "media"
            name: ""
            symbolName: ""
        mouseButton: "off"
        preset: "general"
      - name: "My"
        color: "accent"
        trackpadTap: false
        id: "73E98710-BD36-445F-8CCC-B80C42C02AA5"
