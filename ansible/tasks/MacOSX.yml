- name: Create directory for infat inside ~/.config
  ansible.builtin.file:
    path: ~/.config/infat/
    state: directory
    mode: u=rwx,g=rx,o=rx

- name: Create ~/.config/infat/config.toml file
  ansible.builtin.copy:
    dest: ~/.config/infat/config.toml
    mode: u=rw,g=r,o=r
    content: |
      # Raw UTIs instead of [extensions] - infat resolves extensions to dyn.* UTIs (error -50)
      [types]
      # keep-sorted start
      "com.apple.m4a-audio" = "VLC"
      "com.apple.m4v-video" = "VLC"
      "com.apple.quicktime-movie" = "VLC"
      "com.microsoft.waveform-audio" = "VLC"
      "public.aac-audio" = "VLC"
      "public.avi" = "VLC"
      "public.mp3" = "VLC"
      audio = "VLC"
      movie = "VLC"
      mp4-audio = "VLC"
      mp4-movie = "VLC"
      plain-text = "Visual Studio Code"
      sourcecode = "Visual Studio Code"
      text = "Visual Studio Code"
      # keep-sorted end

# OmniWM rejects incomplete settings files, so only patch the one it creates
- name: Check if OmniWM settings.toml exists
  ansible.builtin.stat:
    path: ~/.config/omniwm/settings.toml
  register: omniwm_settings

- name: Configure OmniWM
  community.general.ini_file:
    path: ~/.config/omniwm/settings.toml
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: u=rw,g=r,o=r
  loop:
    # keep-sorted start block=yes
    - section: borders
      option: enabled
      value: "false"
    - section: focus
      option: followsMouse
      value: "true"
    - section: focus
      option: followsWindowToMonitor
      value: "true"
    - section: focus
      option: moveMouseToFocusedWindow
      value: "true"
    - section: gaps
      option: size
      value: "0.0"
    - section: general
      option: defaultLayoutType
      value: '"dwindle"'
    - section: general
      option: updateChecksEnabled
      value: "false"
    - section: gestures
      option: scrollEnabled
      value: "false"
    - section: hiddenBar
      option: hiddenBundleIDs
      value: '["com.tinyspeck.slackmacgap", "com.okta.mobile", "com.apple.KerberosMenuExtra"]'
    - section: statusMenu
      option: hiddenControls
      value: '["bordersEnabled", "focusCrossesMonitorAtEdge", "focusFollowsWindowToMonitor", "mouseWarpEnabled", "moveCrossesMonitorAtEdge", "moveMouseToFocusedWindow", "preventSleepEnabled"]'
    - section: statusMenu
      option: hiddenMenuItems
      value: '["advanced", "appRules", "checkForUpdates", "diagnostics", "helpLinks", "hiddenIcons", "openShellFolder", "reportBug", "sponsors"]'
    - section: workspaceBar
      option: hideEmptyWorkspaces
      value: "true"
    - section: workspaceBar
      option: hideInNativeFullscreen
      value: "true"
    - section: workspaceBar
      option: inactiveIconOpacity
      value: "1.0"
    - section: workspaceBar
      option: showFloatingWindows
      value: "true"
    # keep-sorted end
  when: omniwm_settings.stat.exists

# Option+Return is used by Midnight Commander (copy filename to prompt)
- name: Set OmniWM toggleFullscreen hotkey
  ansible.builtin.replace:
    path: ~/.config/omniwm/settings.toml
    regexp: '^binding = ".*"\n(id = "toggleFullscreen")$'
    replace: 'binding = "Option+Shift+Return"\n\1'
  when: omniwm_settings.stat.exists

# [[workspaces]] is the last section OmniWM writes (sorted keys)
- name: Configure OmniWM workspaces
  ansible.builtin.replace:
    path: ~/.config/omniwm/settings.toml
    regexp: '^\[\[workspaces\]\][\s\S]*\Z'
    replace: |-
      {% for i in range(1, 9) %}
      [[workspaces]]
      id = "{{ ('omniwm-workspace-' ~ i) | to_uuid | upper }}"
      layoutType = "default"
      name = "{{ i }}"

      [workspaces.monitorAssignment]
      type = "{{ 'main' if i <= 4 else 'secondary' }}"
      {% if not loop.last %}

      {% endif %}
      {% endfor %}
  when: omniwm_settings.stat.exists

# The workspace bar lives in the shell profile, not in settings.toml
- name: Configure OmniWM workspace bar
  community.general.ini_file:
    path: ~/.config/omniwm/shell/shell.toml
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: u=rw,g=r,o=r
  loop:
    # keep-sorted start block=yes
    - section: profiles.default
      option: center
      value: '["workspaces"]'
    - section: profiles.default
      option: leading
      value: "[]"
    - section: profiles.default
      option: trailing
      value: "[]"
    - section: profiles.default.workspaceBar
      option: backgroundOpacity
      value: "0.15"
    - section: profiles.default.workspaceBar
      option: fullWidth
      value: "false"
    - section: profiles.default.workspaceBar
      option: height
      value: "24.0"
    - section: profiles.default.workspaceBar
      option: position
      value: '"belowMenuBar"'
    - section: profiles.default.workspaceBar
      option: reserveLayoutSpace
      value: "false"
    - section: profiles.default.workspaceBar
      option: windowLevel
      value: '"popup"'
    # keep-sorted end
  when: omniwm_settings.stat.exists

- name: Create directory for topgrade inside ~/.config
  ansible.builtin.file:
    path: ~/.config/topgrade
    state: directory
    mode: u=rwx,g=rx,o=rx

# TOML arrays are written on a single line (to_json) - ini_file is line based
- name: Configure topgrade
  community.general.ini_file:
    path: ~/.config/topgrade/topgrade.toml
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: u=rw,g=r,o=r
  loop:
    # keep-sorted start block=yes
    - section: brew
      option: autoremove
      value: "true"
    - section: brew
      option: greedy_cask
      value: "true"
    - section: git
      option: fallback_to_fetch_default
      value: "true"
    - section: git
      option: pull_predefined
      value: "false"
    - section: git
      option: repos
      value: "{{ topgrade_git_repos | to_json }}"
    - section: misc
      option: ask_retry
      value: "false"
    - section: misc
      option: assume_yes
      value: "true"
    - section: misc
      option: cleanup
      value: "true"
    - section: misc
      option: only
      value: "{{ topgrade_only_steps | to_json }}"
    - section: mise
      option: bump
      value: "false"
    - section: vscode
      option: cleanup_obsolete_extensions
      value: "true"
    # keep-sorted end
  vars:
    topgrade_git_repos:
      # keep-sorted start
      - ~/Documents/mckinsey/git/*/
      - ~/git/*/
      # keep-sorted end
    topgrade_only_steps:
      # keep-sorted start
      - brew_cask
      - brew_formula
      - claude_code_plugins
      - git_repos
      - github_cli_extensions
      - github_cli_skills
      - helm
      - krew
      - mise
      - pi
      - vim
      - vscode
      # keep-sorted end

- name: Create directory for Token Monitor
  ansible.builtin.file:
    path: ~/Library/Application Support/Token Monitor/
    state: directory
    mode: u=rwx,g=rx,o=rx

# Only the non-default options; the app fills in the rest on start.
# It rewrites the file on quit, so close it before running this
- name: Configure Token Monitor
  ansible.builtin.copy:
    content: "{{ token_monitor_settings | to_nice_json(indent=2) }}\n"
    dest: ~/Library/Application Support/Token Monitor/settings.json
    mode: u=rw,g=r,o=r
  vars:
    token_monitor_settings:
      # keep-sorted start block=yes
      hiddenHomeModules: limits,device
      homeModuleOrder: limits,tool,device,model,trends,session
      limitProviders: claude,opencode,copilot
      pinnedClients: copilot,claude,opencode
      trayContent: cost
      # keep-sorted end

- name: Copy opencode configuration
  ansible.builtin.copy:
    src: files/home/myusername/.config/opencode
    dest: ~/.config/
    mode: u=rw,g=r,o=r

- name: Link opencode AGENTS.md to the shared gh-repo-defaults
  ansible.builtin.file:
    src: "{{ ansible_facts['user_dir'] }}/git/my-git-projects/gh-repo-defaults/my-defaults/AGENTS.md"
    dest: ~/.config/opencode/AGENTS.md
    state: link
    force: true

################################################
# Interactive (can not be "automated")
################################################
# macOS 26.4+ asks the user to confirm every default app change for file types
# Launch Services is not reachable over SSH - run inside the GUI session
- name: Set default applications for file types
  ansible.builtin.command: >-
    launchctl asuser {{ ansible_facts['user_uid'] }}
    sudo -u {{ ansible_facts['user_id'] }}
    {{ homebrew_prefix }}/bin/infat --config {{ ansible_facts['user_dir'] }}/.config/infat/config.toml
  become: true
  changed_when: false

# The profile disabling Apple Intelligence must be approved in System Settings
# (waits up to 10 minutes); needs the GUI session, so run via launchctl asuser
- name: Turn off Apple Intelligence and delete its models (approve the profile in System Settings)
  ansible.builtin.command: >-
    launchctl asuser {{ ansible_facts['user_uid'] }}
    sudo -u {{ ansible_facts['user_id'] }}
    {{ homebrew_prefix }}/bin/removemacai off --yes
  become: true
  register: removemacai_off
  changed_when: "'No models remain' not in removemacai_off.stdout"
  when: ansible_facts['distribution_major_version'] | int >= 27
  tags: skip_test

# osascript "System Events" login items need an Automation (TCC) approval in the GUI and time out over SSH
- name: Start programs after login using LaunchAgents
  ansible.builtin.copy:
    dest: ~/Library/LaunchAgents/local.login-item.{{ item | lower }}.plist
    mode: u=rw,g=r,o=r
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      <plist version="1.0">
      <dict>
        <key>Label</key>
        <string>local.login-item.{{ item | lower }}</string>
        <key>ProgramArguments</key>
        <array>
          <string>/usr/bin/open</string>
          <string>-a</string>
          <string>/Applications/{{ item }}.app</string>
        </array>
        <key>RunAtLoad</key>
        <true/>
      </dict>
      </plist>
  loop: "{{ login_items_enabled }}"
