- name: Configure sleep settings
  become: true
  block:
    # hibernatemode 0 = do not write /var/vm/sleepimage (saves a few GB of disk space)
    - name: Set hibernation mode to not back memory up to persistent storage
      ansible.builtin.command: pmset -a hibernatemode 0
      changed_when: false

    # https://eclecticlight.co/2017/01/20/power-management-in-detail-using-pmset/
    - name: Turn display off after 30 minutes when running on power adapter
      ansible.builtin.command: pmset -a displaysleep 30
      changed_when: false

    - name: Turn display off after 5 minutes when running on battery
      ansible.builtin.command: pmset -b displaysleep 5
      changed_when: false

    # Wake the Mac at midnight for the backup (local.backup Launch Agent)
    - name: Wake up the Mac every day at midnight
      ansible.builtin.command: pmset repeat wakeorpoweron MTWRFSU 00:00:00
      changed_when: false

  rescue:
    - name: Print when errors
      ansible.builtin.fail:
        msg: Sleep settings failed !!!

- name: Install Homebrew
  ansible.builtin.shell: |
    set -o pipefail
    echo | /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  args:
    creates: "{{ homebrew_prefix }}"

- name: Install Homebrew taps
  community.general.homebrew_tap:
    name: "{{ homebrew_taps | join(',') }}"

# Newer Homebrew refuses formulae/casks from untrusted third-party taps
# (HOMEBREW_REQUIRE_TAP_TRUST); trust ours so their packages can install.
- name: Trust Homebrew taps
  ansible.builtin.command: "{{ homebrew_prefix }}/bin/brew trust {{ homebrew_taps | join(' ') }}"
  changed_when: false

- name: Install Homebrew packages
  community.general.homebrew:
    name: "{{ homebrew_packages }}"
    update_homebrew: true

# `container system start` is one-shot, so `brew services` reports it stopped
# and the homebrew_services module fails re-bootstrapping it
- name: Enable Container service
  ansible.builtin.command: "{{ homebrew_prefix }}/bin/brew services start container"
  args:
    creates: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents/*.container.plist"

# container-apiserver runs in the GUI (Aqua) session, unreachable over SSH - use launchctl asuser.
# `system start` waits for the apiserver and installs the recommended kernel (no-op if running)
- name: Install recommended Container kernel
  ansible.builtin.command: >-
    launchctl asuser {{ ansible_facts['user_uid'] }}
    sudo -u {{ ansible_facts['user_id'] }}
    {{ homebrew_prefix }}/bin/container system start --enable-kernel-install --timeout 120
  args:
    creates: "{{ ansible_facts['user_dir'] }}/Library/Application Support/com.apple.container/kernels/default.kernel-arm64"
  become: true

- name: Enable Homebrew services
  community.general.homebrew_services:
    name: "{{ item }}"
    state: present
  loop: "{{ homebrew_services }}"

- name: Install Homebrew casks
  community.general.homebrew_cask:
    name: "{{ homebrew_casks }}"

# https://www.mactrast.com/2017/03/show-status-bar-finder-macos-sierra/
