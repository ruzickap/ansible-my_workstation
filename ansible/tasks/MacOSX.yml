# macOS 26.4+ asks the user to confirm every default app change for file types
# Launch Services is not reachable over SSH - run inside the GUI session
- name: Set default applications for file types
  ansible.builtin.command: >-
    launchctl asuser {{ ansible_facts['user_uid'] }}
    sudo -u {{ ansible_facts['user_id'] }}
    {{ homebrew_prefix }}/bin/infat --config {{ ansible_facts['user_dir'] }}/.config/infat/config.toml
  become: true
  changed_when: false
  tags: interactive

- name: Interactive - press ENTER to continue
  ansible.builtin.pause:
    prompt: "Manually Approve/Configure all applications/popups and continue by pressing ENTER"
  tags: interactive
