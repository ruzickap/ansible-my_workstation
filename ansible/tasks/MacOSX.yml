- name: Add Launch Agent to run pkgs_upgrade daily at midnight
  ansible.builtin.template:
    src: files/Users/myusername/Library/LaunchAgents/pkgs_upgrade.plist.j2
    dest: ~/Library/LaunchAgents/pkgs_upgrade.plist
    mode: u=rw,g=r,o=r

- name: Activate ~/Library/LaunchAgents/pkgs_upgrade.plist
  ansible.builtin.command: launchctl load ~/Library/LaunchAgents/pkgs_upgrade.plist
  changed_when: launchctl.stderr | length == 0
  register: launchctl

# https://szymonkrajewski.pl/macos-backup-restic/
- name: Add backup Launch Agent
  ansible.builtin.template:
    src: files/Users/myusername/Library/LaunchAgents/backup.plist.j2
    dest: ~/Library/LaunchAgents/backup.plist
    mode: u=rw,g=r,o=r

- name: Activate ~/Library/LaunchAgents/backup.plist
  ansible.builtin.command: launchctl load ~/Library/LaunchAgents/backup.plist
  changed_when: launchctl.stderr | length == 0
  register: launchctl

- name: Remove all Dock items
  ansible.builtin.command: "{{ homebrew_prefix }}/bin/dockutil --remove all --no-restart"
  changed_when: false

- name: Add Dock items
  ansible.builtin.command: "{{ homebrew_prefix }}/bin/dockutil --add '{{ item }}' --no-restart"
  register: dock_add
  changed_when: false
  loop: "{{ dock_add_items }}"

- name: Create directory docker-buildx
  ansible.builtin.file:
    path: ~/.docker/cli-plugins
    state: directory
    mode: u=rwx,g=rx,o=rx

- name: Link the docker-buildx
  ansible.builtin.file:
    src: "{{ homebrew_prefix }}/bin/docker-buildx"
    dest: ~/.docker/cli-plugins/docker-buildx
    state: link

################################################
# ZSH + oh-my-posh + fzf
################################################

# Not in Homebrew, so clone it. Used in ~/.zshrc to defer slow tool inits
# (mise, zoxide, atuin, carapace) until after the first prompt is drawn.
- name: Clone zsh-defer (romkatv) for deferred shell startup
  ansible.builtin.git:
    repo: https://github.com/romkatv/zsh-defer
    dest: ~/.config/zsh/zsh-defer
    depth: 1
    version: master
  tags:
    - skip_idempotence_test

- name: Create directory for zsh-patina inside ~/.config
  ansible.builtin.file:
    path: ~/.config/zsh-patina
    state: directory
    mode: u=rwx,g=rx,o=rx

- name: Copy zsh-patina config.toml
  ansible.builtin.copy:
    content: |
      [highlighting]
      theme = "tokyonight"
    dest: ~/.config/zsh-patina/config.toml
    mode: u=rw,g=r,o=r

- name: Create directory for oh-my-posh
  ansible.builtin.file:
    path: ~/.config/oh-my-posh
    state: directory
    mode: u=rwx,g=rx,o=rx

- name: Download oh-my-posh cobalt2 theme
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/refs/heads/main/themes/cobalt2.omp.json
    dest: ~/.config/oh-my-posh/cobalt2.omp.json
    mode: u=rw,g=r,o=r

# Needed for bash scripts or ansible
- name: Add path to binaries to ~/.bashrc
  ansible.builtin.copy:
    dest: ~/.bashrc
    content: |
      export MC_XDG_OPEN=open

      if ps $PPID |grep mc; then
        PS1="\w ❯ "
      fi
    mode: u=rw,g=r,o=r

- name: Add configurations to ~/.zshrc
  ansible.builtin.blockinfile:
    dest: ~/.zshrc
    prepend_newline: true
    create: true
    mode: u=rw,g=r,o=r
    block: |
      # set history size
      export HISTSIZE=50000
      # save history after logout
      export SAVEHIST=10000
      # save only one command if 2 common are same and consistent
      setopt HIST_IGNORE_ALL_DUPS
      # add timestamp for each entry
      setopt EXTENDED_HISTORY

      # Allow mise caching (https://mise.jdx.dev/configuration/settings.html#env_cache)
      export MISE_ENV_CACHE=1

      # Use bat for the brew cat command
      export HOMEBREW_BAT=1
      # Cleanup all cached files older than this many days
      export HOMEBREW_CLEANUP_MAX_AGE_DAYS=7
      # Stop Homebrew auto update
      export HOMEBREW_NO_AUTO_UPDATE=1

      eval "$(/opt/homebrew/bin/brew shellenv)"

      # Enable homebrew, find, sed, coreutils
      MY_GENERATED_PATH=$(for BIN in ${HOMEBREW_PREFIX}/opt/*/libexec/gnubin ; do echo -n "${BIN}:"; done)
      export PATH="${MY_GENERATED_PATH}${PATH}"

      # Enable man pages
      MY_GENERATED_MAN=$(for MAN in ${HOMEBREW_PREFIX}/opt/*/libexec/gnuman ; do echo -n "${MAN}:"; done)
      export MANPATH="${MY_GENERATED_MAN}${MANPATH}"

      # Enable binaries for node, krew and ~/bin
      export PATH="/usr/local/bin:${HOME}/.krew/bin:${HOME}/bin:${HOME}/.local/bin:${HOME}/Documents/mckinsey/bin:${HOME}/go/bin:${PATH}"

      # zsh-completions
      FPATH=${HOMEBREW_PREFIX}/share/zsh-completions:${FPATH}
      typeset -U fpath path PATH FPATH
      autoload -Uz compinit
      # Use fast `-C` (skips compaudit) only when a fresh dump (<24h) exists;
      # otherwise rebuild + audit with plain `compinit` (missing == old).
      if [[ -n ${ZDOTDIR:-$HOME}/.zcompdump(#qN.mh-24) ]]; then
        compinit -C
      else
        compinit
      fi

      # https://unix.stackexchange.com/questions/470714/replicate-oh-my-zsh-directory-tab-completion-selection-with-arrow-keys
      # https://unix.stackexchange.com/questions/267551/how-can-i-configure-zsh-completion-to-launch-a-menu-for-command-options
      zstyle ':completion:*' menu yes select

      # https://coderwall.com/p/jpj_6q/zsh-better-history-searching-with-arrow-keys
      # https://unix.stackexchange.com/questions/621606/zsh-completion-with-up-and-down-arrows
      autoload -U up-line-or-beginning-search
      autoload -U down-line-or-beginning-search
      zle -N up-line-or-beginning-search
      zle -N down-line-or-beginning-search
      bindkey "^[[A" up-line-or-beginning-search # Up
      bindkey "^[[B" down-line-or-beginning-search # Down

      # Add home and end key bindings to be able to use the USB keyboard to navigate the terminal
      bindkey '\e[H'    beginning-of-line # Home
      bindkey '\e[F'    end-of-line # End

      alias cat="bat --style=plain --paging=never"
      alias cl="claude --permission-mode acceptEdits"
      alias dos2unix="sed -i 's/\r$//'"
      alias history="history -i 0"
      alias ll="eza -l --git --git-repos --icons=auto"
      alias ls="eza --icons=auto"
      alias mc='SHELL=/bin/bash TERM=xterm-256color source "${HOMEBREW_PREFIX}/opt/mc/libexec/mc/mc-wrapper.sh" --nomouse'
      alias md5sum_dir="rhash --md5 --recursive --percents --output=md5sum.md5 ." # DevSkim: ignore DS126858
      compdef kubecolor=kubectl
      alias k="kubecolor"
      alias tree="eza --tree --icons=auto"
      alias unix2dos="awk 'sub(\"$\",\"\r\")' "
      alias vim='nvim'

      export DELTA_PAGER="bat --style=plain"
      export EDITOR='nvim'
      export PAGER="bat --style=plain --paging=never"

      source "${HOMEBREW_PREFIX}/opt/fzf/shell/completion.zsh"
      source "${HOMEBREW_PREFIX}/opt/fzf/shell/key-bindings.zsh"

      # Load zsh-defer so heavy tool inits (queued below) run AFTER the first
      # prompt is drawn, keeping new tabs instant.
      source "${HOME}/.config/zsh/zsh-defer/zsh-defer.plugin.zsh"

      # ignore # on command line - https://unix.stackexchange.com/questions/557486/allowing-comments-in-interactive-zsh-commands
      setopt INTERACTIVE_COMMENTS

      # Disable Kopia updates checks
      export KOPIA_CHECK_FOR_UPDATES=false

      # Configure Docker CLI to use Socktainer
      export DOCKER_HOST="unix://${HOMEBREW_PREFIX}/var/run/socktainer/.socktainer/container.sock"

      # Configure TF_PLUGIN_CACHE_DIR for Terraform / OpenTofu
      export TF_PLUGIN_CACHE_DIR="${HOME}/.terraform.d/plugin-cache"

      # Configure RUMDL_CACHE_DIR for rumdl
      export RUMDL_CACHE_DIR="${HOME}/.cache/rumdl-cache"

      # Prevent Google Cloud CLI from creating local command logs
      export CLOUDSDK_CORE_DISABLE_FILE_LOGGING=1

      # Keep oh-my-posh EAGER (no instant-prompt); defer the rest. Use
      # `zsh-defer -c '...'` so the slow `$(...)` subprocess is deferred too.
      eval "$(oh-my-posh init zsh --config ~/.config/oh-my-posh/cobalt2.omp.json)"
      zsh-defer -c 'eval "$(atuin init zsh --disable-up-arrow)"'
      zsh-defer -c 'eval "$(mise activate zsh)"'
      zsh-defer -c 'eval "$(zoxide init zsh)"'
      zsh-defer -c 'eval "$(${HOMEBREW_PREFIX}/bin/zsh-patina activate)"'
      # carapace generates a large completion script; defer it off the
      # critical path as well.
      zsh-defer -c 'source <(carapace _carapace)'

