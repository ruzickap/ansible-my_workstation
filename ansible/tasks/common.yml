###############################
# Run as root
###############################

- name: Run tasks as root
  become: true
  block:
    - name: Create directory for mc inside ~/.config
      ansible.builtin.file:
        path: ~/.config/mc/
        state: directory
        mode: u=rwx,g=rx,o=rx
      tags: mc

    - name: Create ~/.config/mc/ini file
      community.general.ini_file:
        path: ~/.config/mc/ini
        no_extra_spaces: true
        section: "{{ item.section }}"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        mode: u=rw,g=r,o=r
      loop:
        # keep-sorted start
        - section: Layout
          option: keybar_visible
          value: "false"
        - section: Layout
          option: menubar_visible
          value: "false"
        - section: Layout
          option: message_visible
          value: "false"
        - section: Midnight-Commander
          option: auto_save_setup
          value: "false"
        - section: Midnight-Commander
          option: drop_menus
          value: "true"
        - section: Midnight-Commander
          option: editor_return_does_auto_indent
          value: "false"
        - section: Panels
          option: navigate_with_arrows
          value: "true"
        # keep-sorted end
      tags: mc

    - name: Copy mc.ext.ini to the ~/.config/mc/
      ansible.builtin.copy:
        src: "{{ homebrew_prefix }}/opt/mc/etc/mc/mc.ext.ini"
        dest: ~/.config/mc/mc.ext.ini
        remote_src: true
        mode: u=rw,g=r,o=r
      when: ansible_facts['system'] == 'Darwin'
      changed_when: false
      tags: mc

    - name: Change default in ~/.config/mc/mc.ext.ini
      community.general.ini_file:
        path: ~/.config/mc/mc.ext.ini
        no_extra_spaces: true
        section: "{{ item.section }}"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        mode: u=rw,g=r,o=r
      loop:
        # keep-sorted start
        - section: Include/image
          option: View
          value: "%view{ascii} exiftool %p"
        - section: gpx
          option: Open
          value: "{% if ansible_facts['system'] == 'Linux' %}xdg-{% endif %}open %f &> /dev/null"
        - section: gpx
          option: Regex
          value: "\\.gpx$"
        - section: gpx
          option: RegexIgnoreCase
          value: "true"
        - section: raw
          option: Open
          value: "{% if ansible_facts['system'] == 'Linux' %}xdg-{% endif %}open %f &> /dev/null"
        - section: raw
          option: Regex
          value: "\\.(nef|orf|ori|dng|arw)$"
        - section: raw
          option: RegexIgnoreCase
          value: "true"
        - section: raw
          option: View
          value: "%view{ascii} exiftool %p"
        # keep-sorted end
      changed_when: false
      tags: mc

    - name: Replace some scripts by "open"
      ansible.builtin.replace:
        dest: ~/.config/mc/mc.ext.ini
        regexp: "Open={{ homebrew_prefix }}.*/(doc.sh|image.sh|sound.sh|video.sh) open.*"
        replace: "Open=(open %f &)"
      when: ansible_facts['system'] == 'Darwin'
      changed_when: false
      tags: mc

    - name: Replace version specific directories
      ansible.builtin.replace:
        dest: ~/.config/mc/mc.ext.ini
        regexp: "{{ homebrew_prefix }}Cellar/midnight-commander/.*/libexec/"
        replace: "{{ homebrew_prefix }}opt/midnight-commander/libexec/"
      when: ansible_facts['system'] == 'Darwin'
      changed_when: false
      tags: mc

    - name: Create directory ~/.config for the {{ ansible_facts['user_id'] }}
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/.config/"
        state: directory
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] | string }}"
        mode: u=rwx,g=,o=
      tags: mcs

    - name: Copy mc configuration to to User's home directory
      ansible.builtin.copy:
        src: ~/.config/mc
        dest: "{{ ansible_facts['user_dir'] }}/.config/"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] | string }}"
        remote_src: true
        mode: u=rwx,g=rx,o=rx
      changed_when: false
      tags: mc

    - name: Place public ssh to authorized_key for root and {{ ansible_facts['user_id'] }}
      ansible.posix.authorized_key:
        user: "{{ item }}"
        key: https://github.com/{{ github_username }}.keys
        comment: "{{ email }}"
      loop:
        - "{{ ansible_facts['user_id'] }}"

  rescue:
    - name: Print when errors
      ansible.builtin.fail:
        msg: Root tasks failed - check !!!

###############################
# Run as user
###############################

- name: Create ~/bin directory
  ansible.builtin.file:
    path: ~/bin
    state: directory
    mode: u=rwx,g=rx,o=rx
  tags: mc

# Used by mc (ext.d/video.sh) to show video details on F3 - not installed by Homebrew
- name: Download mpv_identify.sh
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/mpv-player/mpv/master/TOOLS/mpv_identify.sh
    dest: ~/bin/mpv_identify.sh
    mode: u=rwx,g=rx,o=rx
  tags: mc

- name: Install NvChad
  ansible.builtin.git:
    repo: "https://github.com/NvChad/starter"
    dest: ~/.config/nvim
    depth: 1
    single_branch: true

- name: Create directory for mpv inside ~/.config
  ansible.builtin.file:
    path: ~/.config/mpv/
    state: directory
    mode: u=rwx,g=,o=

- name: Configure mpv
  community.general.ini_file:
    path: ~/.config/mpv/mpv.conf
    no_extra_spaces: true
    section: null
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: u=rw,g=r,o=r
  loop:
    # keep-sorted start
    - option: autofit-larger
      value: 100%x95%
    - option: icc-contrast
      value: 1000
    - option: osd-font-size
      value: 30
    - option: osd-level
      value: 2
    - option: osd-status-msg
      value: "'${time-pos} / ${duration}${?percent-pos:  (${percent-pos}%)}${?frame-drop-count:${!frame-drop-count==0:  Dropped: ${frame-drop-count}}}\\n${?chapter:Chapter: ${chapter}}'"
    - option: slang
      value: cz,cze,Czech
    - option: sub-ass-style-overrides
      value: Kerning=yes
    - option: sub-auto
      value: all
    - option: sub-border-color
      value: '"#ff262626"'
    - option: sub-border-size
      value: 2.0
    - option: sub-color
      value: '"#e6d21a"'
    - option: sub-font-size
      value: 40
    - option: sub-shadow-color
      value: '"#33000000"'
    - option: sub-shadow-offset
      value: 1
    - option: volume-max
      value: 200
    # keep-sorted end

- name: Configure mpv
  community.general.ini_file:
    path: ~/.config/mpv/mpv.conf
    section: null
    allow_no_value: true
    option: "{{ item.option }}"
    mode: u=rw,g=r,o=r
  loop:
    # keep-sorted start
    - option: hwdec
    - option: keep-open
    - option: save-position-on-quit
    - option: term-osd-bar
    # keep-sorted end

- name: Create directory for VLC
  ansible.builtin.file:
    path: "{% if ansible_facts['system'] == 'Darwin' %}~/Library/Application Support/org.videolan.vlc{% else %}~/.config/vlc{% endif %}"
    state: directory
    mode: u=rwx,g=rx,o=rx

- name: Copy VLC media library file
  ansible.builtin.copy:
    src: files/home/myusername/.config/vlc/ml.xspf
    dest: "{% if ansible_facts['system'] == 'Darwin' %}~/Library/Application Support/org.videolan.vlc{% else %}~/.config/vlc{% endif %}/ml.xspf"
    mode: u=rw,g=r,o=r

- name: Create directory for Ghostty
  ansible.builtin.file:
    path: ~/.config/ghostty
    state: directory
    mode: u=rwx,g=rx,o=rx

- name: Configure Ghostty
  ansible.builtin.copy:
    dest: ~/.config/ghostty/config.ghostty
    content: |
      auto-update = off
      copy-on-select = clipboard
      cursor-color = #FFFF00
      font-feature = -calt, -liga, -dlig
      font-size = 14
      font-thicken = true
      keybind = cmd+shift+left=move_tab:-1
      keybind = cmd+shift+right=move_tab:1
      keybind = shift+end=scroll_to_bottom
      keybind = shift+home=scroll_to_top
      keybind = shift+page_down=scroll_page_down
      keybind = shift+page_up=scroll_page_up
      macos-titlebar-style = tabs
      macos-window-buttons = hidden
      mouse-hide-while-typing = true
      mouse-scroll-multiplier = precision:3,discrete:3
      quit-after-last-window-closed = true
      split-divider-color = green
      theme = iTerm2 Dark Background
      unfocused-split-opacity = 0.8
      window-height = 50
      window-width = 183

      # https://github.com/ghostty-org/ghostty/discussions/3836
      cursor-style = block
      shell-integration-features = no-cursor
    mode: u=rw,g=r,o=r

- name: Install krew plugins
  ansible.builtin.command: kubectl krew install {{ item }}
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts['env']['HOME'] }}/.krew/bin:{{ ansible_facts['env']['PATH'] }}"
  args:
    creates: ~/.krew/store/{{ item }}
  loop: "{{ krew_plugins }}"

- name: Create directory for KeePassXC settings
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: u=rwx,g=rwx,o=rx
  loop:
    - "{% if ansible_facts['system'] == 'Darwin' %}~/Library/Application Support{% else %}~/.config{% endif %}/keepassxc"
    - "{% if ansible_facts['system'] == 'Darwin' %}~/Library/Caches{% else %}~/.config{% endif %}/keepassxc"

- name: KeePassXC settings
  community.general.ini_file:
    path: "{% if ansible_facts['system'] == 'Darwin' %}~/Library/Application Support{% else %}~/.config{% endif %}/keepassxc/keepassxc.ini"
    no_extra_spaces: true
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: u=rw,g=,o=
  loop:
    # keep-sorted start
    - section: Browser
      option: AlwaysAllowAccess
      value: "true"
    - section: Browser
      option: Enabled
      value: "true"
    - section: Browser
      option: HttpAuthPermission
      value: "true"
    - section: GUI
      option: CheckForUpdates
      value: "false"
    - section: GUI
      option: MonospaceNotes
      value: "true"
    - section: GUI
      option: ShowExpiredEntriesOnDatabaseUnlockOffsetDays
      value: 30
    - section: General
      option: AutoSaveAfterEveryChange
      value: "false"
    - section: General
      option: AutoSaveOnExit
      value: "false"
    - section: General
      option: MinimizeAfterUnlock
      value: "true"
    - section: General
      option: UpdateCheckMessageShown
      value: "true"
    - section: PasswordGenerator
      option: AdditionalChars
      value: '",."'
    - section: PasswordGenerator
      option: AdvancedMode
      value: "true"
    - section: PasswordGenerator
      option: Length
      value: 16
    - section: PasswordGenerator
      option: SpecialChars
      value: "false"
    - section: SSHAgent
      option: Enabled
      value: "true"
    - section: Security
      option: ClearSearch
      value: "true"
    - section: Security
      option: LockDatabaseScreenLock
      value: "false"
    # keep-sorted end

- name: KeePassXC settings
  community.general.ini_file:
    path: "{% if ansible_facts['system'] == 'Darwin' %}~/Library/caches/{% else %}~/.config{% endif %}/keepassxc/keepassxc.ini"
    no_extra_spaces: true
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: u=rw,g=,o=
  loop:
    - section: General
      option: LastActiveDatabase
      value: "{{ ansible_facts['user_dir'] }}/Documents/secrets/keepass2.kdbx"

- name: Put Code configuration in place
  ansible.builtin.copy:
    src: files/home/myusername/.config/Code
    dest: "{% if ansible_facts['system'] == 'Darwin' %}~/Library/Application Support/{% else %}~/.config/{% endif %}"
    directory_mode: u=rwx,g=rx,o=rx
    mode: u=rw,g=r,o=r

- name: Install the Code extensions
  ansible.builtin.command: code --install-extension {{ item }}
  environment:
    PATH: "{{ homebrew_prefix }}/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
  args:
    creates: ~/.vscode/extensions/{{ item | lower }}*
  loop: "{{ code_extensions }}"

- name: Create ~/.config/git
  ansible.builtin.file:
    path: ~/.config/git
    state: directory
    mode: u=rwx,g=rx,o=rx

- name: Create git allowed_signers file
  ansible.builtin.copy:
    dest: "{{ ansible_facts['user_dir'] }}/.config/git/allowed_signers"
    content: |
      petr.ruzicka@gmail.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF58juRs3gDSCFXARSXBBSegOmmBxXln9MVk2Zcq3HGh
    mode: u=rw,g=r,o=r

- name: Configure git
  ansible.builtin.copy:
    src: files/home/myusername/.gitconfig
    dest: ~/.gitconfig
    mode: u=rw,g=r,o=r

- name: Configure Ansible
  ansible.builtin.copy:
    src: files/home/myusername/.ansible.cfg
    dest: ~/.ansible.cfg
    mode: u=rw,g=r,o=r

- name: Create ~/.config/mise
  ansible.builtin.file:
    path: ~/.config/mise
    state: directory
    mode: u=rwx,g=rx,o=rx

- name: Configure mise
  ansible.builtin.copy:
    dest: ~/.config/mise/config.toml
    content: |
      [tools]
      "npm:markdown-spellcheck" = "latest"
      "npm:mega-linter-runner" = "latest"

      [settings]
      env_cache = true
      env_cache_ttl = "12h"
      trusted_config_paths = ["/"]
    mode: u=rw,g=r,o=r

- name: Create ~/.config/rumdl
  ansible.builtin.file:
    path: ~/.config/rumdl
    state: directory
    mode: u=rwx,g=rx,o=rx

- name: Configure rumdl
  ansible.builtin.copy:
    dest: ~/.config/rumdl/rumdl.toml
    content: |
      [global]
      cache-dir = "/tmp/rumdl-cache"

      [MD060]
      enabled = true
      style = "aligned"
    mode: u=rw,g=r,o=r

- name: Configure terraform
  ansible.builtin.copy:
    dest: ~/.terraformrc
    content: |
      plugin_cache_dir = "${HOME}/.terraform.d/plugin-cache"
    mode: u=rw,g=r,o=r

- name: Create ~/.claude directory
  ansible.builtin.file:
    path: ~/.claude
    state: directory
    mode: u=rwx,g=rx,o=rx

- name: Download oh-my-posh blazed theme for Claude Code
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/josheche/blazed-omp/main/blazed.omp.json
    dest: ~/.claude/blazed.omp.json
    mode: u=rw,g=r,o=r

- name: Configure Claude Code
  ansible.builtin.copy:
    dest: ~/.claude/settings.json
    content: |
      {
        "attribution": {
          "commit": "",
          "pr": ""
        },
        "permissions": {
          "allow": [
            "Bash(*)",
            "Read(*)",
            "Edit(*)",
            "Write(*)",
            "Glob(*)",
            "Grep(*)"
          ],
          "ask": [
            "Bash(rm -rf:*)",
            "Bash(rm -fr:*)",
            "Read(.env)",
            "Read(.env.*)",
            "Read(**/.env)",
            "Read(**/.env.*)",
            "Read(~/.ssh/**)",
            "Read(~/.aws/**)",
            "Read(**/*credential*)",
            "Read(**/*secret*)",
            "Read(**/*.pem)",
            "Read(**/*.key)"
          ]
        },
        "env": {
          "IS_DEMO": "1"
        },
        "model": "opus[1m]",
        "statusLine": {
          "type": "command",
          "command": "oh-my-posh claude --config ~/.claude/blazed.omp.json"
        },
        "enabledPlugins": {
          "code-review@claude-plugins-official": true,
          "context7@claude-plugins-official": true,
          "skill-creator@claude-plugins-official": true,
          "superpowers@claude-plugins-official": true
        },
        "skipDangerousModePermissionPrompt": true,
        "spinnerTipsEnabled": false,
        "alwaysThinkingEnabled": true,
        "effortLevel": "high"
      }
    mode: u=rw,g=r,o=r

- name: Configure ~/.claude.json
  ansible.builtin.copy:
    dest: ~/.claude.json
    content: |
      {
        "hasTrustDialogAccepted": true
      }
    mode: u=rw,g=,o=

# GH_TOKEN is read on the controller (exported by run_ansible_my_workstation*.sh)
- name: Add agent skills
  ansible.builtin.command: >-
    gh skill install {{ item.repo }} {{ item.skill }} --agent warp --scope user --allow-hidden-dirs --force
  environment:
    GH_TOKEN: "{{ lookup('ansible.builtin.env', 'GH_TOKEN') }}"
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts['env']['PATH'] }}"
  args:
    creates: ~/.agents/skills/{{ item.name }}
  loop: "{{ code_opencode_agent_skills }}"
  when: lookup('ansible.builtin.env', 'GH_TOKEN') | length > 0

- name: Copy gh configuration files
  ansible.builtin.copy:
    src: files/home/myusername/.config/gh
    dest: ~/.config/
    mode: u=rw,g=,o=

###################################################
# Data
###################################################

- name: Copy data (this will take a long time)
  ansible.posix.synchronize:
    src: "{{ data_source_dir }}/{{ item }}"
    dest: ~/
    rsync_opts:
      - "--quiet"
  loop: "{{ home_data_directories }}"
  tags:
    - data
